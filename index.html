<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pomelo × Pago TIC | Reacciones</title>
<style>
:root{--o:#ff5b1f;--ink:#1c1a19;--cream:#faf7f1;--pink:#ffebe2;--lime:#cff55b}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,sans-serif}.wrap{max-width:950px;margin:auto;padding:25px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:900}.brand span{color:var(--o)}.tag{background:var(--ink);color:#fff;border-radius:99px;padding:8px 13px;font-size:11px}.hero{padding:35px 0 15px}.kicker{font-size:11px;font-weight:900;color:var(--o);letter-spacing:.1em}h1{font-size:clamp(38px,7vw,70px);line-height:.92;margin:12px 0}.muted{color:#aaa;line-height:1.5}.card{background:#fff;padding:24px;border-radius:24px;margin:18px 0;box-shadow:0 12px 35px #0000000b}input{width:100%;padding:15px;border:2px solid #ddd;border-radius:13px;font-size:16px}.avatars{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}.av{background:#fff;border:2px solid #eee;border-radius:18px;padding:16px 8px;font-size:38px;cursor:pointer;text-align:center}.av small{display:block;font-size:12px;font-weight:800;margin-top:7px}.av.sel{border-color:var(--o);background:var(--pink)}.cta{background:var(--o);border:0;color:white;padding:16px 20px;border-radius:14px;font-weight:900;width:100%;font-size:15px;cursor:pointer;margin-top:20px}.screen{min-height:100vh;background:var(--ink);color:#fff;padding:26px}.feed{display:flex;flex-wrap:wrap;gap:10px;min-height:150px;margin:28px 0}.bubble{display:flex;align-items:center;gap:9px;background:#302d2b;border-radius:16px;padding:10px 14px;animation:pop .25s}.bubble .face{font-size:30px}.reactions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.reaction{border:0;border-radius:16px;background:#302d2b;color:#fff;padding:13px 8px;cursor:pointer;font-weight:800}.reaction span{display:block;font-size:28px;margin-bottom:4px}.danger{background:#d92929;color:#fff;border:0;border-radius:15px;padding:17px;width:100%;font-weight:900;margin-top:32px;cursor:pointer}.overlay{position:fixed;inset:0;background:var(--o);color:var(--ink);z-index:10;display:flex;align-items:center;justify-content:center;text-align:center;padding:25px}.overlay .face{font-size:125px}.overlay h2{font-size:clamp(30px,5vw,50px)}.overlay button{border:0;border-radius:99px;padding:13px 20px;font-weight:900}.mode{margin-top:15px;text-align:center}.mode button{border:1px solid #ddd;background:transparent;border-radius:99px;padding:9px 14px;cursor:pointer}.status{font-size:12px;color:#777;margin-top:12px}.empty{color:#aaa;border:1px dashed #555;border-radius:16px;padding:22px;width:100%}.clear{background:transparent;border:1px solid #777;color:#fff;border-radius:99px;padding:9px 14px;cursor:pointer}@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}@media(max-width:600px){.reactions{grid-template-columns:repeat(2,1fr)}.avatars{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script>
<script>
const choices=[['🐱','Gatito'],['🚀','Cohete'],['🏎️','F1'],['😄','Smile'],['🎩','Galera'],['🧟','Zombie']];
const reactions=[['🚀','SÍ, OBVIO'],['⚡','FARMEAR AURA'],['👍','BANCO'],['😃','ME COPA'],['🤯','ME EXPLOTÓ'],['😎','DEMÁS']];
const ROOM='POMELO-PAGOTIC'; let db=null, me=null, selected=0, channel=null, recentIds=new Set();
const app=document.getElementById('app');
function configured(){return window.POMELO_CONFIG && window.POMELO_CONFIG.supabaseUrl && window.POMELO_CONFIG.supabaseAnonKey && window.supabase;}
function connect(){if(!configured())return false;db=window.supabase.createClient(window.POMELO_CONFIG.supabaseUrl,window.POMELO_CONFIG.supabaseAnonKey);return true;}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function configError(){app.innerHTML=`<div class="wrap"><div class="top"><div class="brand">POMELO <span>INSIGHT</span> × PAGO TIC</div><div class="tag">SALA EN VIVO</div></div><div class="hero"><div class="kicker">FALTA UN ÚLTIMO PASO</div><h1>Conectemos<br>la sala.</h1><p class="muted">La web está lista, pero todavía falta configurar las credenciales públicas del proyecto Supabase en el archivo <b>config.js</b>. Seguí el README incluido en el paquete.</p></div></div>`;}
function choose(){app.innerHTML=`<div class="wrap"><div class="top"><div class="brand">POMELO <span>INSIGHT</span> × PAGO TIC</div><div class="tag">SALA POMELO × PAGO TIC</div></div><div class="hero"><div class="kicker">BIENVENIDO/A A LA EXPERIENCIA</div><h1>Elegí tu<br>personaje.</h1><p class="muted">Poné tu nombre, elegí un avatar y preparate para reaccionar durante la clase.</p></div><div class="card"><label><b>¿Cómo te llamás?</b></label><input id="name" maxlength="22" placeholder="Tu nombre"><p><b>Elegí un avatar</b></p><div class="avatars" id="avatars"></div><button class="cta" id="join">ARRANCAMOS →</button><div class="status" id="status">Conectando con la sala…</div></div></div>`;
choices.forEach((a,i)=>{let b=document.createElement('button');b.className='av'+(i===0?' sel':'');b.innerHTML=a[0]+'<small>'+a[1]+'</small>';b.onclick=()=>{selected=i;document.querySelectorAll('.av').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')};document.getElementById('avatars').appendChild(b)});
document.getElementById('join').onclick=join;
}
async function send(row){const {error}=await db.from('room_events').insert({...row,room_code:ROOM});if(error)console.error(error);return !error;}
async function join(){let name=document.getElementById('name').value.trim()||'Anónimo';me={id:crypto.randomUUID(),name,avatar:choices[selected][0]};document.getElementById('join').disabled=true;document.getElementById('status').textContent='Entrando a la sala…';const ok=await send({event_type:'join',participant_id:me.id,name:me.name,avatar:me.avatar});if(ok)participant();else{document.getElementById('status').textContent='No pudimos conectar. Revisá la configuración de Supabase.';document.getElementById('join').disabled=false;}}
function participant(){app.innerHTML=`<div class="screen"><div class="top"><div class="brand">POMELO <span>INSIGHT</span> × PAGO TIC</div><div class="tag">HOLA, ${esc(me.name.toUpperCase())}</div></div><h1>Reaccioná<br>sin miedo.</h1><p class="muted">Tu avatar va a aparecer en la pantalla del presentador.</p><div class="feed"><div class="bubble"><span class="face">${me.avatar}</span><b>${esc(me.name)}</b></div></div><div class="reactions">${reactions.map((r,i)=>`<button class="reaction" data-r="${i}"><span>${r[0]}</span>${r[1]}</button>`).join('')}</div><button class="danger" id="danger">🔴 NO TOQUES ESTE BOTÓN POR NINGÚN MOTIVO</button><div class="status">Estás en la sala POMELO × PAGO TIC</div></div>`;
document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>react(Number(b.dataset.r)));document.getElementById('danger').onclick=dont;
}
async function react(i){let r=reactions[i];await send({event_type:'reaction',participant_id:me.id,name:me.name,avatar:me.avatar,emoji:r[0],label:r[1]});}
async function dont(){await send({event_type:'danger',participant_id:me.id,name:me.name,avatar:me.avatar});}
function presenter(){app.innerHTML=`<div class="screen"><div class="top"><div class="brand">POMELO <span>INSIGHT</span> × PAGO TIC</div><div class="tag" id="count">SALA EN VIVO · 0</div></div><h1>¿Quién está<br>por acá?</h1><p class="muted">Las reacciones y los avatares aparecen acá en tiempo real.</p><div class="feed" id="feed"><div class="empty" id="empty">Esperando a que se sumen los participantes…</div></div><div class="mode"><button class="clear" id="clear">Limpiar pantalla</button></div><p class="muted">Compartí esta ventana por Google Meet. Los participantes entran desde sus celulares con el link o QR.</p></div>`;document.getElementById('clear').onclick=()=>{document.getElementById('feed').innerHTML='<div class="empty">Pantalla limpia. ¡Seguimos!</div>';};}
function addParticipant(p){const f=document.getElementById('feed');if(!f)return;document.getElementById('empty')?.remove();let d=document.createElement('div');d.className='bubble';d.dataset.person=p.participant_id;d.innerHTML=`<span class="face">${p.avatar||'🙂'}</span><b>${esc(p.name||'Participante')}</b>`;f.appendChild(d);let c=document.getElementById('count');if(c)c.textContent=(f.querySelectorAll('.bubble').length)+' EN LA SALA';}
function burst(p){let f=document.getElementById('feed');if(!f)return;let d=document.createElement('div');d.className='bubble';d.innerHTML=`<span class="face">${p.avatar||'🙂'}</span><b>${esc(p.name||'Participante')}</b><span>${p.emoji||''} ${esc(p.label||'')}</span>`;f.prepend(d);setTimeout(()=>d.remove(),5500);}
function alarm(p){let d=document.createElement('div');d.className='overlay';d.innerHTML=`<div><div class="face">${p.avatar||'🙂'}</div><h2>${esc(p.name||'Alguien')} tocó el botón que no había que tocar.</h2><p>La confianza en nuestros comerciales acaba de caer un 12%.</p><button>FUE SIN QUERER 😇</button></div>`;d.querySelector('button').onclick=()=>d.remove();document.body.appendChild(d);}
function handle(row){if(!row||recentIds.has(row.id))return;recentIds.add(row.id);if(recentIds.size>500)recentIds.clear();if(row.event_type==='join')addParticipant(row);if(row.event_type==='reaction')burst(row);if(row.event_type==='danger')alarm(row);}
async function startPresenter(){presenter();const {data,error}=await db.from('room_events').select('*').eq('room_code',ROOM).eq('event_type','join').order('created_at',{ascending:true}).limit(150);if(error)console.error(error);(data||[]).forEach(addParticipant);subscribe();}
function subscribe(){channel=db.channel('room-'+ROOM).on('postgres_changes',{event:'INSERT',schema:'public',table:'room_events',filter:'room_code=eq.'+ROOM},payload=>handle(payload.new)).subscribe(status=>{const c=document.getElementById('count');if(c&&status==='SUBSCRIBED')c.textContent+=' · CONECTADO';});}
async function init(){if(!connect()){configError();return;}if(new URLSearchParams(location.search).has('presenter'))await startPresenter();else choose();}
init();
</script></body></html>
